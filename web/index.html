<header><a class="brand" href="/">◇ <strong>形转</strong><span>MODEL CONVERTER</span></a><span class="tag">为下一步建模准备</span></header>
<main><section class="intro"><div class="eyebrow">3MF / STL / STEP</div><h1>换个格式，<br>继续创造<span>。</span></h1><p>从打印网格到 CAD 实体。<br>让模型进入你的下一段工作流。</p><div class="formats"><span>3MF</span><i>↔</i><span>STL</span><i>↔</i><span>STEP</span></div><div class="note"><b>面向 Shapr3D</b><p>网格转 STEP 保留模型形状，并尝试合并共面面片；不会恢复原始参数化特征。</p></div></section>
<section class="panel"><div class="panel-head"><span>01 / 转换工作台</span><span class="dot">就绪</span></div>

<label id="key-label">服务访问口令<input id="key" type="password" autocomplete="current-password" placeholder="STEP 转换需要访问口令"></label>
<p id="hint" class="hint">选择一个模型文件开始。</p><button id="convert" disabled>开始转换 <span>↗</span></button></form>
